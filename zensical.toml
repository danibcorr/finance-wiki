[project]
site_name = "Daniel Bazo Correa"
site_description = "Mi wiki personal sobre finanzas personales e inversión en Español"
site_author = "Daniel Bazo Correa"
site_url = "https://danibcorr.github.io/finance-wiki/"
repo_url = "https://github.com/danibcorr/finance-wiki"
repo_name = "danibcorr/finance-wiki"
copyright = "Copyright &copy; 2026 Daniel Bazo Correa. Contenido bajo licencia <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es\">CC BY-NC-SA 4.0</a>"
nav = [
    {"Inicio" = "index.md"},
    {"Finanzas personales" = [
        {"Fundamentos" = [
            "01_personal/section_1_fundamentos.md",
            "01_personal/section_2_ahorro_y_liquidez.md",
            "01_personal/section_3_deuda_y_vivienda.md",
            "01_personal/section_4_proteccion_y_jubilacion.md",
            "01_personal/section_5_fiscalidad.md"
        ]},
        {"Planificación" = [
            "02_planificacion/section_1_objetivos.md",
            "02_planificacion/section_2_independencia_financiera.md"
        ]}
    ]},
    {"Mercados" = [
        {"Entorno macroeconómico" = [
            "03_macro/section_1_tipos_e_inflacion.md",
            "03_macro/section_2_renta_fija.md",
            "03_macro/section_3_liquidez_remunerada.md"
        ]},
        {"Instrumentos" = [
            "04_instrumentos/section_1_renta_variable.md",
            "04_instrumentos/section_2_fondos_y_etfs.md",
            "04_instrumentos/section_3_inmobiliario.md",
            "04_instrumentos/section_4_derivados_y_materias_primas.md",
            "04_instrumentos/section_5_alternativos.md"
        ]}
    ]},
    {"Inversión" = [
        {"Análisis de empresas" = [
            "05_analisis/section_1_metricas_contables.md",
            "05_analisis/section_2_valoracion.md",
            "05_analisis/section_3_calidad_y_trampas.md"
        ]},
        {"Cartera" = [
            "06_cartera/section_1_asignacion_de_activos.md",
            "06_cartera/section_2_core_satellite.md",
            "06_cartera/section_3_treynor_black.md",
            "06_cartera/section_4_riesgo_y_control.md"
        ]},
        {"Conducta y evidencia" = [
            "07_conducta/section_1_filosofia_de_inversion.md",
            "07_conducta/section_2_sesgos_cognitivos.md",
            "07_conducta/section_3_crisis_historicas.md"
        ]}
    ]},
    {"Referencia" = [
        "08_referencia/glosario.md"
    ]},
]
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = [
    "assets/javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

[project.theme]
language = "es"
logo = "assets/img/branding/white_logo.svg"
favicon = "assets/img/branding/logo.ico"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
accent = "orange"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "orange"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
homepage = "https://www.linkedin.com/in/danibcorr/"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/danibcorr/"

[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 3

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]